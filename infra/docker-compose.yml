services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lordam
      POSTGRES_PASSWORD: lordam
      POSTGRES_DB: lordam
    ports:
      - "5432:5432"
    volumes:
      - lordam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lordam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lordam:lordam@postgres:5432/lordam
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  lordam_postgres_data:
